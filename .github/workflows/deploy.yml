name: Build, Push & Deploy

# Push to main -> build both images, push to GHCR, then SSH into the server
# and pull+restart. Pull requests only get the "build" job (a sanity check,
# nothing is pushed or deployed). Manual runs via workflow_dispatch redeploy
# whatever is currently on main without rebuilding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  # Cheap sanity check on every push/PR: does the frontend actually build,
  # is the backend syntactically valid. Catches obvious breakage before it
  # ever reaches an image build.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend install + syntax check
        working-directory: backend
        run: |
          npm ci
          node --check server.js

  # Builds and pushes both images to GHCR. Runs only on an actual push to
  # main (not on PRs — a PR from a fork wouldn't have push permission anyway).
  build-and-push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        id: vars
        run: |
          echo "image_prefix=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-backend:latest
            ${{ steps.vars.outputs.image_prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-frontend:latest
            ${{ steps.vars.outputs.image_prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # SSHes into the server and swaps in the images just pushed above. The
  # server's own .env holds every secret (DB creds, JWT_SECRET, DOMAIN, ...)
  # — this job only overrides IMAGE_PREFIX/TAG for the duration of the pull.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            export IMAGE_PREFIX="${{ needs.build-and-push.outputs.image_prefix }}"
            export TAG="${{ github.sha }}"
            docker compose pull backend frontend
            docker compose up -d --remove-orphans
            docker image prune -f
