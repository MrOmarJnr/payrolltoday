# ============================================================================
#  LEF ERP — full stack: database + backend API + frontend + phpMyAdmin
# ----------------------------------------------------------------------------
#  All secrets live in .env (never in this file or the Dockerfiles).
#  Local dev:   docker compose up -d --build
#  Push:        docker compose build && docker compose push
#  On server:   docker compose pull && docker compose up -d
# ============================================================================

services:
  db:
    image: mariadb:10.11
    container_name: lef-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # SQL files here run automatically the FIRST time the DB is created,
      # in alphabetical order (01_ = existing HR schema+data, 02_ = ERP tables).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-lef}/lef-backend:${TAG:-latest}
    container_name: lef-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: nginx (this container) proxies /api to the backend
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${DOCKERHUB_USER:-lef}/lef-frontend:${TAG:-latest}
    container_name: lef-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lef-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"

volumes:
  db_data:
  uploads_data:
